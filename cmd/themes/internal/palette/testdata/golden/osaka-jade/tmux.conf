# tmux theme (derived by theme-derive; do not edit)
#
# Transparent status bar (bg=default — terminal bg shows through).
# Current tab keeps an accent bg + YIQ-contrast fg so it's readable on
# both light and dark themes.

# --- status bar shell ------------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 100
set -g status-style "bg=default,fg=#C1C497"

# --- window tabs -----------------------------------------------------------
# Inactive tabs: transparent, muted foreground.
# Current tab:   accent background + high-contrast foreground.
set -g window-status-separator " "
set -g window-status-style "bg=default,fg=#627A6C"
set -g window-status-current-style "bg=default,fg=#549E6A,bold"
set -g window-status-activity-style "bg=default,fg=#459451"
set -g window-status-bell-style "bg=default,fg=#FF5345,bold"

set -g window-status-format "#[fg=#627A6C] #I #W "
set -g window-status-current-format "#[fg=#000000,bg=#549E6A,bold] #I #W#{?window_zoomed_flag,✴,} "

# --- panes -----------------------------------------------------------------
set -g pane-border-style "fg=#23372B"
set -g pane-active-border-style "fg=#63B07A"
set -g pane-border-status bottom
set -g pane-border-format "#[align=left,fg=#627A6C] #{pane_current_path} #[align=right,fg=#2DD5B7]#(~/.config/tmux/plugins/tmux-cpu/scripts/ram_percentage.sh 2>/dev/null) RAM #[fg=#549E6A]#(~/.config/tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh 2>/dev/null) CPU #[fg=#459451]#(~/.config/tmux/plugins/tmux-battery/scripts/battery_percentage.sh 2>/dev/null) #[fg=#627A6C]%H:%M %d-%b "

# --- pane background: default (transparent, terminal bg shows through) ----
# Explicitly 'default' so tmux doesn't fill panes with its status bg.
set -g window-style "bg=default,fg=#C1C497"
set -g window-active-style "bg=default,fg=#C1C497"
set -g cursor-colour "#549E6A"

# --- messages / modes ------------------------------------------------------
set -g message-style "bg=#23372B,fg=#C1C497"
set -g message-command-style "bg=#23372B,fg=#459451"
set -g mode-style "bg=#63B07A,fg=#111C18"
set -g clock-mode-colour "#63B07A"
set -g copy-mode-match-style "bg=#459451,fg=#111C18"
set -g copy-mode-current-match-style "bg=#63B07A,fg=#111C18"

# --- status-left / status-right --------------------------------------------
# Left: PREFIX / COPY indicators + session name.
# Right: cwd basename + accent divider + time.
set -g status-left "#{?client_prefix,#[fg=#000000#,bg=#459451#,bold] PREFIX #[default],}#{?pane_in_mode,#[fg=#000000#,bg=#2DD5B7#,bold] COPY #[default],}#[fg=#549E6A,bold] #S #[fg=#627A6C]│ "
set -g status-right "#[fg=#627A6C]#{b:pane_current_path} #[fg=#549E6A]│ #[fg=#C1C497]%H:%M "
