set -g pane-border-format "#[align=left,bg=default,fg=#627A6C] #{pane_current_path} #[align=right,bg=default,fg=#2DD5B7]#(~/.config/tmux/plugins/tmux-cpu/scripts/ram_percentage.sh 2>/dev/null) RAM #[bg=default,fg=#549E6A]#(~/.config/tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh 2>/dev/null) CPU #[bg=default,fg=#63B07A]#(~/.config/tmux/plugins/tmux-battery/scripts/battery_percentage.sh 2>/dev/null) #[bg=default,fg=#627A6C]%H:%M %d-%b "
